# docker-compose.override.yml for the official zammad stack.
# install-server.sh copies this into ./zammad/docker-compose.override.yml
# and lists it (plus the official disable-elasticsearch scenario) in the
# COMPOSE_FILE variable of zammad's .env.
# Dedicated-server mode (ECS-20687837-001, 4C/8G, Zammad has the host
# to itself since 2026-10-23; the old co-location caps are GONE):
#   * Port: set NGINX_EXPOSE_PORT=8899 in zammad's .env (done by the
#     installer). NOT 8080: on the unfiled mainland cloud instance the
#     filing ports {80, 8080, 443, 8443} are blocked inbound; ports like
#     8888/8899 work (same lesson as the course system moving to 8888).
#   * Elasticsearch service disabled via the official scenario file
#     scenarios/disable-elasticsearch-service.yml (profile do-not-start).
#   * Memory caps raised 2026-10-24: the co-location caps (scheduler
#     and railsserver squeezed to 512m/1536m) caused kernel
#     "Memory cgroup out of memory" kills of Zammad's ruby processes
#     in a ~7-second loop on the dedicated host. Caps below now fit
#     an 8G host with headroom for the OS and the bridge (256m);
#     they are ceilings, not allocations.
services:
  zammad-nginx:
    mem_limit: 256m
  zammad-railsserver:
    mem_limit: 3072m
  zammad-websocket:
    mem_limit: 1024m
  zammad-scheduler:
    mem_limit: 1536m
  zammad-postgresql:
    mem_limit: 1024m
  zammad-redis:
    mem_limit: 256m
  zammad-memcached:
    mem_limit: 256m
  zammad-backup:
    mem_limit: 512m
