# Bridge middleware only. Zammad itself runs from the official
# zammad-docker-compose stack (cloned by install-server.sh into ./zammad),
# FusionPBX/FreeSWITCH runs on the host (its installer is not Docker based).
services:
  bridge:
    build: ../middleware
    container_name: bike-bridge
    restart: unless-stopped
    env_file:
      - ../middleware/.env
    mem_limit: 256m
    environment:
      # Reach Zammad's nginx on the host-published port 8899.
      ZAMMAD_URL: http://host.docker.internal:8899
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Published on 8890 so the /test page (simulated call trigger) is
      # reachable from the operator's browser during trials without an
      # IPPBX. All POST endpoints require the X-Bridge-Secret header.
      # Phase 2: FreeSWITCH on the same host posts events/CDR here too.
      - "8890:8090"
    volumes:
      - bridge-data:/data
      # Recordings directory (writable: simulated calls write their WAV
      # here in phase 1). Phase 2: point FreeSWITCH to record into this
      # host directory, or replace with its recordings path.
      - ../recordings:/recordings

volumes:
  bridge-data:
