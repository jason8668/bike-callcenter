# Bridge middleware + FreeSWITCH. Zammad itself runs from the official
# zammad-docker-compose stack (cloned by install-server.sh into ./zammad).
# FreeSWITCH runs with host networking so SIP/RTP need no NAT tricks and
# 127.0.0.1:8890 reaches the bridge's published port.
services:
  bridge:
    build: ../middleware
    container_name: bike-bridge
    restart: unless-stopped
    env_file:
      - ../middleware/.env
    mem_limit: 256m
    environment:
      # Reach Zammad's nginx on the host-published port 8899.
      ZAMMAD_URL: http://host.docker.internal:8899
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Published on 8890 so the /test page (simulated call trigger) is
      # reachable from the operator's browser during trials without an
      # IPPBX. All POST endpoints require the X-Bridge-Secret header.
      # Phase 2: FreeSWITCH on the same host posts events/CDR here too.
      - "8890:8090"
    volumes:
      - bridge-data:/data
      # Recordings directory (writable: simulated calls write their WAV
      # here in phase 1). Phase 2: point FreeSWITCH to record into this
      # host directory, or replace with its recordings path.
      - ../recordings:/recordings

  freeswitch:
    build: ../freeswitch
    container_name: bike-freeswitch
    restart: unless-stopped
    network_mode: host
    volumes:
      # Live config generated by deploy/install-freeswitch.sh from
      # freeswitch/conf-templates/ (passwords + secret, never in Git).
      - ../freeswitch/conf-live:/etc/freeswitch
      # Same recordings volume as the bridge, so CDR/voicemail paths
      # resolve to the same files the bridge attaches to tickets.
      - ../recordings:/recordings

volumes:
  bridge-data:
