# Record service (bridge middleware) + FreeSWITCH. No Zammad: this is a
# record system, not a ticket system - the bridge itself stores the call
# records and serves the record list/detail pages on port 8890.
# FreeSWITCH runs with host networking so SIP/RTP need no NAT tricks and
# 127.0.0.1:8890 reaches the bridge's published port.
services:
  bridge:
    build: ../middleware
    container_name: bike-bridge
    restart: unless-stopped
    env_file:
      - ../middleware/.env
    mem_limit: 256m
    # Host networking is REQUIRED, not a convenience: FreeSWITCH's event
    # socket listens on the host loopback (127.0.0.1:8021), and a
    # loopback listener refuses connections aimed at the Docker gateway
    # IP that host.docker.internal resolves to from a container. Sharing
    # the host network makes 127.0.0.1:8021 reachable, and uvicorn
    # listens on 8890 directly, so the desk URL stays http://server:8890/.
    # (No ports mapping in host mode; it would be ignored.)
    network_mode: host
    volumes:
      - bridge-data:/data
      # Recordings directory (writable: simulated calls write their WAV
      # here in phase 1). Phase 2: point FreeSWITCH to record into this
      # host directory, or replace with its recordings path.
      - ../recordings:/recordings
      # Read-only view of the FreeSWITCH tree so the bridge can read the
      # server-side event-socket password (esl-password.txt, gitignored)
      # for agent busy control; no restart needed when it appears.
      - ../freeswitch:/freeswitch-config:ro

  freeswitch:
    build: ../freeswitch
    container_name: bike-freeswitch
    restart: unless-stopped
    network_mode: host
    volumes:
      # Live config generated by deploy/install-freeswitch.sh from
      # freeswitch/conf-templates/ (passwords + secret, never in Git).
      - ../freeswitch/conf-live:/etc/freeswitch
      # Same recordings volume as the bridge, so CDR/voicemail paths
      # resolve to the same files the record detail page plays back.
      - ../recordings:/recordings

volumes:
  bridge-data:
